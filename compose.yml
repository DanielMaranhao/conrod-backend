services:
  database:
    image: postgres
    ports:
      - ${DATABASE_PORT}:5432
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit
    ports:
      - ${MAIL_PORT}:1025
      - 8025:8025
    environment:
      MP_SMTP_AUTH: ${MAIL_USER}:${MAIL_PASSWORD}
      MP_SMTP_AUTH_ALLOW_INSECURE: true

volumes:
  database_data:
